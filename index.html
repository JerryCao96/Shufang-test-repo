<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List App</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Todo List</h1>

      <form id="todo-form" class="todo-form" autocomplete="off">
        <label for="todo-input" class="sr-only">Add a task</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="What do you need to do?"
          maxlength="120"
          required
        />
        <button type="submit">Add</button>
      </form>

      <section class="toolbar" aria-label="Task controls">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button type="button" data-filter="all" class="is-active">All</button>
          <button type="button" data-filter="active">Active</button>
          <button type="button" data-filter="completed">Completed</button>
        </div>
        <button type="button" id="clear-completed" class="ghost">
          Clear completed
        </button>
      </section>

      <p id="task-count" class="task-count" aria-live="polite">0 tasks</p>

      <ul id="todo-list" class="todo-list" aria-label="Todo items"></ul>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <label class="todo-label">
          <input class="todo-toggle" type="checkbox" />
          <span class="todo-text"></span>
        </label>
        <button class="delete-btn" type="button" aria-label="Delete task">
          Delete
        </button>
      </li>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
